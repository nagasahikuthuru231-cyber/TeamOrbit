x-env: &env
  DJANGO_SECRET_KEY: change-me
  DJANGO_DEBUG: "1"
  POSTGRES_DB: pm
  POSTGRES_USER: pm
  POSTGRES_PASSWORD: pm
  POSTGRES_HOST: db
  REDIS_URL: redis://redis:6379/0
  STRIPE_SECRET_KEY: sk_test_replace_me
  STRIPE_WEBHOOK_SECRET: whsec_replace_me
  STRIPE_PRICE_PRO: price_replace_me

services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: pm, POSTGRES_USER: pm, POSTGRES_PASSWORD: pm}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  web:
    build: ./backend
    environment: *env
    command: sh -c "python manage.py makemigrations core --noinput && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: ./backend
    environment: *env
    command: celery -A config worker -l info
    depends_on: [db, redis]
  beat:
    build: ./backend
    environment: *env
    command: celery -A config beat -l info
    depends_on: [redis]
volumes:
  pgdata: {}
